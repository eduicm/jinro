<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 전자칠판</title>
  
  <!-- Tailwind CSS (디자인용) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 및 ReactDOM (기능용) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel (JSX 문법 해석용) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* 기본 스크롤바 숨김 처리 등 기본 스타일 */
    body { margin: 0; padding: 0; overflow: hidden; background-color: #f1f5f9; }
  </style>
</head>
<body>
  <!-- 리액트 앱이 실행될 공간 -->
  <div id="root"></div>

  <!-- 여기서부터 애플리케이션 코드입니다 -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ---------------------------------------------------------
    // 아이콘 컴포넌트 (외부 라이브러리 없이 직접 SVG로 구현하여 오프라인 호환성 극대화)
    // ---------------------------------------------------------
    const Icon = ({ children, size = 24, className = '' }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {children}
      </svg>
    );
    const Play = (p) => <Icon {...p}><polygon points="6 3 20 12 6 21 6 3" /></Icon>;
    const Pause = (p) => <Icon {...p}><rect x="14" y="4" width="4" height="16" rx="1" /><rect x="6" y="4" width="4" height="16" rx="1" /></Icon>;
    const RotateCcw = (p) => <Icon {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></Icon>;
    const Eraser = (p) => <Icon {...p}><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21" /><path d="M22 21H7" /><path d="m5 11 9 9" /></Icon>;
    const Pen = (p) => <Icon {...p}><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" /><path d="m15 5 4 4" /></Icon>;
    const Trash2 = (p) => <Icon {...p}><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /><line x1="10" x2="10" y1="11" y2="17" /><line x1="14" x2="14" y1="11" y2="17" /></Icon>;
    const Clock = (p) => <Icon {...p}><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></Icon>;
    const X = (p) => <Icon {...p}><path d="M18 6 6 18" /><path d="m6 6 12 12" /></Icon>;
    const Users = (p) => <Icon {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></Icon>;
    const Dices = (p) => <Icon {...p}><rect width="18" height="18" x="3" y="3" rx="2" ry="2" /><path d="M8 8h.01" /><path d="M16 8h.01" /><path d="M8 16h.01" /><path d="M16 16h.01" /><path d="M12 12h.01" /></Icon>;

    // ---------------------------------------------------------
    // 오디오 설정
    // ---------------------------------------------------------
    let audioCtx;
    const initAudio = () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    };

    const playTimerSound = () => {
      try {
        const ctx = initAudio();
        for (let i = 0; i < 10; i++) {
          const time = i * 0.5;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, ctx.currentTime + time);
          gain.gain.setValueAtTime(0.5, ctx.currentTime + time);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + time + 0.3);
          osc.start(ctx.currentTime + time);
          osc.stop(ctx.currentTime + time + 0.3);
        }
      } catch (e) { console.log(e); }
    };

    const playResultSound = () => {
      try {
        const ctx = initAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1046.5, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
      } catch (e) { console.log(e); }
    };

    // ---------------------------------------------------------
    // 메인 앱 컴포넌트
    // ---------------------------------------------------------
    function App() {
      // 1. 날짜 상태
      const [todayString, setTodayString] = useState('');

      useEffect(() => {
        const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
        setTodayString(new Date().toLocaleDateString('ko-KR', options));
      }, []);

      // 2. 캔버스 (판서) 상태 및 로직
      const canvasRef = useRef(null);
      const containerRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);
      const [color, setColor] = useState('#2563EB');
      const [lineWidth, setLineWidth] = useState(4);
      const [isEraserMode, setIsEraserMode] = useState(false);

      const initCanvas = useCallback(() => {
        const canvas = canvasRef.current;
        const container = containerRef.current;
        if (canvas && container) {
          const context = canvas.getContext('2d');
          const tempCanvas = document.createElement('canvas');
          const tempCtx = tempCanvas.getContext('2d');
          tempCanvas.width = canvas.width;
          tempCanvas.height = canvas.height;
          tempCtx.drawImage(canvas, 0, 0);

          canvas.width = container.clientWidth;
          canvas.height = container.clientHeight;

          context.lineCap = 'round';
          context.lineJoin = 'round';
          context.drawImage(tempCanvas, 0, 0);
        }
      }, []);

      useEffect(() => {
        initCanvas();
        window.addEventListener('resize', initCanvas);
        return () => window.removeEventListener('resize', initCanvas);
      }, [initCanvas]);

      const getCoordinates = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return { x: 0, y: 0 };
        const rect = canvas.getBoundingClientRect();
        
        let clientX, clientY;
        if (e.touches && e.touches.length > 0) {
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
        } else {
          clientX = e.clientX;
          clientY = e.clientY;
        }

        return { x: clientX - rect.left, y: clientY - rect.top };
      };

      const startDrawing = (e) => {
        e.preventDefault();
        const { x, y } = getCoordinates(e);
        const context = canvasRef.current.getContext('2d');
        context.beginPath();
        context.moveTo(x, y);
        setIsDrawing(true);
      };

      const draw = (e) => {
        e.preventDefault();
        if (!isDrawing) return;
        const { x, y } = getCoordinates(e);
        const context = canvasRef.current.getContext('2d');
        
        context.strokeStyle = isEraserMode ? '#ffffff' : color;
        context.lineWidth = isEraserMode ? 40 : lineWidth;
        
        context.lineTo(x, y);
        context.stroke();
      };

      const stopDrawing = () => {
        if (isDrawing) {
          const context = canvasRef.current.getContext('2d');
          context.closePath();
          setIsDrawing(false);
        }
      };

      const clearCanvas = () => {
        if(window.confirm('칠판의 모든 내용을 지우시겠습니까?')) {
          const canvas = canvasRef.current;
          const context = canvas.getContext('2d');
          context.clearRect(0, 0, canvas.width, canvas.height);
        }
      };

      // 3. 타이머 상태 및 로직
      const [timerPreset, setTimerPreset] = useState(5);
      const [timeLeft, setTimeLeft] = useState(300);
      const [isTimerRunning, setIsTimerRunning] = useState(false);
      const [timerAlert, setTimerAlert] = useState(false);
      const [isTimerCentered, setIsTimerCentered] = useState(false);
      const [isTimerFinished, setIsTimerFinished] = useState(false);

      useEffect(() => {
        let interval;
        if (isTimerRunning && timeLeft > 0) {
          interval = setInterval(() => setTimeLeft((prev) => prev - 1), 1000);
        } else if (timeLeft === 0 && isTimerRunning) {
          setIsTimerRunning(false);
          setTimerAlert(true);
          setIsTimerFinished(true);
          playTimerSound();
        }
        return () => clearInterval(interval);
      }, [isTimerRunning, timeLeft, timerPreset]);

      const startTimer = () => {
        initAudio();
        if (timeLeft === 0) setTimeLeft(timerPreset * 60);
        setIsTimerFinished(false);
        setTimerAlert(false);
        setIsTimerRunning(true);
        setIsTimerCentered(true);
      };

      const pauseTimer = () => setIsTimerRunning(false);

      const resetTimer = () => {
        setIsTimerRunning(false);
        setIsTimerCentered(false);
        setIsTimerFinished(false);
        setTimerAlert(false);
        setTimeLeft(timerPreset * 60);
      };

      const handlePresetClick = (min) => {
        if (isTimerRunning) return;
        setTimerPreset(min);
        setTimeLeft(min * 60);
      };

      const displayMins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const displaySecs = (timeLeft % 60).toString().padStart(2, '0');

      // 4. 번호 뽑기 상태 및 로직
      const [maxStudentNum, setMaxStudentNum] = useState(30);
      const [selectedNum, setSelectedNum] = useState(null);
      const [isSpinning, setIsSpinning] = useState(false);
      const [isPickerCentered, setIsPickerCentered] = useState(false);
      const [isPickerFinished, setIsPickerFinished] = useState(false);

      const pickRandomNumber = () => {
        initAudio();
        if (maxStudentNum < 1) return;
        setIsSpinning(true);
        setIsPickerCentered(true);
        setIsPickerFinished(false);
        setSelectedNum(null);
        
        let counter = 0;
        const spinInterval = setInterval(() => {
          setSelectedNum(Math.floor(Math.random() * maxStudentNum) + 1);
          counter++;
          if (counter > 15) {
            clearInterval(spinInterval);
            setIsSpinning(false);
            setSelectedNum(Math.floor(Math.random() * maxStudentNum) + 1);
            playResultSound();
            setIsPickerFinished(true);
          }
        }, 50);
      };

      // 4-1. 모둠 발표 순서 상태 및 로직
      const [groupOrder, setGroupOrder] = useState([1, 2, 3, 4, 5, 6]);
      const [isGroupSpinning, setIsGroupSpinning] = useState(false);
      const [isGroupCentered, setIsGroupCentered] = useState(false);
      const [isGroupFinished, setIsGroupFinished] = useState(false);

      const shuffleGroups = () => {
        initAudio();
        setIsGroupSpinning(true);
        setIsGroupCentered(true);
        setIsGroupFinished(false);
        
        let counter = 0;
        const spinInterval = setInterval(() => {
          setGroupOrder(prev => [...prev].sort(() => Math.random() - 0.5));
          counter++;
          if (counter > 15) {
            clearInterval(spinInterval);
            setIsGroupSpinning(false);
            playResultSound();
            setIsGroupFinished(true);
          }
        }, 100);
      };

      // 5. 위젯 렌더링 헬퍼
      const renderTimerWidget = (isCentered) => (
        <div className={`bg-white rounded-2xl shadow-lg border border-slate-200 flex flex-col items-center relative transition-transform ${isCentered ? 'p-8 scale-[2] origin-center z-50' : 'p-6 h-full'}`}>
          {isCentered && isTimerFinished && (
            <div 
              className="absolute inset-0 z-30 flex flex-col items-center justify-end pb-6 rounded-2xl cursor-pointer bg-transparent"
              onClick={() => resetTimer()}
            >
              <span className="text-xs font-bold text-slate-700 bg-white/90 px-4 py-2 rounded-full shadow-lg animate-bounce">
                화면을 클릭하여 닫기
              </span>
            </div>
          )}
          
          {isCentered && (
            <button onClick={() => resetTimer()} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition-colors z-40">
              <X size={24} />
            </button>
          )}
          <div className="flex items-center gap-2 mb-4 w-full text-slate-700 font-semibold border-b pb-2">
            <Clock size={20} />
            <h2>활동 타이머</h2>
          </div>

          <div className="flex flex-wrap justify-center gap-2 mb-6 relative z-20">
            {[1, 3, 5, 7, 10].map(min => (
              <button
                key={min}
                onClick={() => handlePresetClick(min)}
                disabled={isTimerRunning}
                className={`px-3 py-1.5 rounded-full text-sm font-bold transition-colors ${timerPreset === min ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'} disabled:opacity-50 disabled:cursor-not-allowed`}
              >
                {min}분
              </button>
            ))}
          </div>

          <div className={`text-7xl font-black font-mono tracking-tighter mb-6 transition-colors duration-300 relative z-20 ${timerAlert ? 'text-red-500 animate-pulse' : 'text-slate-800'}`}>
            {displayMins}:{displaySecs}
          </div>

          <div className="flex w-full gap-3 mt-auto relative z-20">
            <button 
              onClick={isTimerRunning ? pauseTimer : startTimer}
              className={`flex-1 py-3 rounded-xl flex items-center justify-center gap-2 font-bold text-white transition-transform active:scale-95 ${isTimerRunning ? 'bg-amber-500 hover:bg-amber-600' : 'bg-blue-600 hover:bg-blue-700'}`}
            >
              {isTimerRunning ? <Pause size={20} /> : <Play size={20} />}
              {isTimerRunning ? '일시정지' : '시작'}
            </button>
            <button 
              onClick={resetTimer}
              className="py-3 px-4 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors"
              title="리셋"
            >
              <RotateCcw size={20} />
            </button>
          </div>
        </div>
      );

      const renderPickerWidget = (isCentered) => (
        <div className={`bg-white rounded-2xl shadow-lg border border-slate-200 flex flex-col items-center relative transition-transform ${isCentered ? 'p-8 scale-[2] origin-center z-50' : 'p-6 flex-1 h-full'}`}>
          {isCentered && isPickerFinished && (
            <div 
              className="absolute inset-0 z-30 flex flex-col items-center justify-end pb-6 rounded-2xl cursor-pointer bg-transparent"
              onClick={() => { setIsPickerCentered(false); setIsPickerFinished(false); }}
            >
              <span className="text-xs font-bold text-slate-700 bg-white/90 px-4 py-2 rounded-full shadow-lg animate-bounce">
                화면을 클릭하여 닫기
              </span>
            </div>
          )}
          
          {isCentered && (
            <button onClick={() => { setIsPickerCentered(false); setIsPickerFinished(false); }} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition-colors z-40">
              <X size={24} />
            </button>
          )}
          <div className="flex items-center gap-2 mb-4 w-full text-slate-700 font-semibold border-b pb-2">
            <Dices size={20} />
            <h2>발표자 뽑기</h2>
          </div>

          <div className="flex items-center gap-3 mb-6 relative z-20">
            <span className="text-slate-600 font-medium">총 인원:</span>
            <input 
              type="number" 
              value={maxStudentNum} 
              min="2" max="100"
              onChange={(e) => setMaxStudentNum(parseInt(e.target.value) || 2)}
              className="w-20 p-2 text-center text-lg border rounded-lg bg-slate-50 focus:ring-2 focus:ring-purple-500 outline-none"
            />
            <span className="text-slate-600 font-medium">명</span>
          </div>

          <div className="flex-1 flex items-center justify-center w-full mb-6 py-4 relative z-20">
            <div className={`w-32 h-32 rounded-full flex items-center justify-center bg-purple-100 border-4 border-purple-200 shadow-inner transition-all duration-200 ${isSpinning ? 'scale-95 bg-purple-200' : 'scale-100'}`}>
              <span className={`text-6xl font-black text-purple-700 ${isSpinning ? 'opacity-50 blur-[1px]' : 'opacity-100'}`}>
                {selectedNum !== null ? selectedNum : '?'}
              </span>
            </div>
          </div>

          <button 
            onClick={pickRandomNumber}
            disabled={isSpinning}
            className="w-full mt-auto py-4 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-bold text-lg transition-transform active:scale-95 disabled:opacity-70 disabled:cursor-not-allowed flex items-center justify-center gap-2 shadow-md relative z-20"
          >
            <Dices size={24} />
            {isSpinning ? '고르는 중...' : '번호 뽑기'}
          </button>
        </div>
      );

      const renderGroupWidget = (isCentered) => (
        <div className={`bg-white rounded-2xl shadow-lg border border-slate-200 flex flex-col items-center relative transition-transform ${isCentered ? 'p-8 scale-[2] origin-center z-50' : 'p-6 flex-1 h-full'}`}>
          {isCentered && isGroupFinished && (
            <div 
              className="absolute inset-0 z-30 flex flex-col items-center justify-end pb-6 rounded-2xl cursor-pointer bg-transparent"
              onClick={() => { setIsGroupCentered(false); setIsGroupFinished(false); }}
            >
              <span className="text-xs font-bold text-slate-700 bg-white/90 px-4 py-2 rounded-full shadow-lg animate-bounce">
                화면을 클릭하여 닫기
              </span>
            </div>
          )}

          {isCentered && (
            <button onClick={() => { setIsGroupCentered(false); setIsGroupFinished(false); }} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition-colors z-40">
              <X size={24} />
            </button>
          )}
          <div className="flex items-center gap-2 mb-4 w-full text-slate-700 font-semibold border-b pb-2">
            <Users size={20} />
            <h2>모둠 순서 뽑기 (6모둠)</h2>
          </div>

          <div className={`flex-1 flex flex-col justify-center w-full mb-6 py-2 transition-all duration-200 relative z-20 ${isGroupSpinning ? 'opacity-50 blur-[1px]' : 'opacity-100'}`}>
            <div className="grid grid-cols-3 gap-3">
              {groupOrder.map((group, idx) => (
                <div key={idx} className="flex flex-col items-center p-3 bg-indigo-50 rounded-xl border border-indigo-100 shadow-sm">
                  <span className="text-xs text-indigo-400 font-bold mb-1">{idx + 1}번째</span>
                  <span className={`text-2xl font-black ${isGroupSpinning ? 'text-indigo-400' : 'text-indigo-700'}`}>
                    {group}조
                  </span>
                </div>
              ))}
            </div>
          </div>

          <button 
            onClick={shuffleGroups}
            disabled={isGroupSpinning}
            className="w-full mt-auto py-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-lg transition-transform active:scale-95 disabled:opacity-70 disabled:cursor-not-allowed flex items-center justify-center gap-2 shadow-md relative z-20"
          >
            <Users size={24} />
            {isGroupSpinning ? '섞는 중...' : '순서 섞기'}
          </button>
        </div>
      );

      return (
        <div className="flex h-screen w-full bg-slate-100 font-sans p-4 gap-4 box-border overflow-hidden select-none">
          {/* 왼쪽 메인 영역 (전자칠판) */}
          <div className="flex-1 flex flex-col bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
            <header className="flex items-center justify-between p-4 border-b bg-slate-50">
              <div className="flex items-center gap-2">
                <h1 className="text-2xl font-bold text-slate-800 tracking-tight">{todayString}</h1>
              </div>
              
              <div className="flex items-center gap-3 bg-white p-2 rounded-xl shadow-sm border border-slate-200">
                <div className="flex gap-1 pr-3 border-r border-slate-200">
                  {['#EF4444', '#F59E0B', '#10B981', '#3B82F6', '#8B5CF6', '#1E293B'].map(c => (
                    <button
                      key={c}
                      onClick={() => { setColor(c); setIsEraserMode(false); }}
                      className={`w-8 h-8 rounded-full border-2 transition-transform ${color === c && !isEraserMode ? 'scale-110 border-slate-800' : 'border-transparent hover:scale-105'}`}
                      style={{ backgroundColor: c }}
                      title={`${c} 색상`}
                    />
                  ))}
                </div>
                
                <input 
                  type="range" min="1" max="20" value={lineWidth} 
                  onChange={(e) => setLineWidth(parseInt(e.target.value))}
                  className="w-24 accent-slate-600"
                  disabled={isEraserMode}
                />

                <div className="flex gap-1 pl-3 border-l border-slate-200">
                  <button onClick={() => setIsEraserMode(false)} className={`p-2 rounded-lg transition-colors ${!isEraserMode ? 'bg-slate-200 text-slate-800' : 'text-slate-500 hover:bg-slate-100'}`} title="펜"><Pen size={20} /></button>
                  <button onClick={() => setIsEraserMode(true)} className={`p-2 rounded-lg transition-colors ${isEraserMode ? 'bg-slate-200 text-slate-800' : 'text-slate-500 hover:bg-slate-100'}`} title="지우개"><Eraser size={20} /></button>
                  <button onClick={clearCanvas} className="p-2 rounded-lg text-red-500 hover:bg-red-50 transition-colors ml-2" title="전체 지우기"><Trash2 size={20} /></button>
                </div>
              </div>
            </header>

            <main ref={containerRef} className="flex-1 relative cursor-crosshair overflow-hidden" style={{ touchAction: 'none' }}>
              <canvas
                ref={canvasRef}
                className="absolute top-0 left-0 w-full h-full"
                onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseOut={stopDrawing}
                onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing}
              />
            </main>
          </div>

          {/* 오른쪽 사이드바 */}
          <div className="w-80 flex flex-col gap-4 relative z-0 overflow-y-auto pb-2">
            <div className="shrink-0 min-h-[320px] flex flex-col">
              {isTimerCentered ? (
                <div className="bg-slate-200/50 rounded-2xl border-2 border-dashed border-slate-300 p-6 flex flex-col items-center justify-center flex-1">
                  <Clock size={32} className="text-slate-400 mb-2 opacity-50" />
                  <span className="text-slate-500 font-bold text-center text-sm">중앙 화면에서<br/>실행 중</span>
                </div>
              ) : renderTimerWidget(false)}
            </div>

            <div className="shrink-0 min-h-[320px] flex flex-col">
              {isPickerCentered ? (
                <div className="bg-slate-200/50 rounded-2xl border-2 border-dashed border-slate-300 p-6 flex flex-col items-center justify-center flex-1">
                  <Dices size={32} className="text-slate-400 mb-2 opacity-50" />
                  <span className="text-slate-500 font-bold text-center text-sm">중앙 화면에서<br/>실행 중</span>
                </div>
              ) : renderPickerWidget(false)}
            </div>

            <div className="shrink-0 min-h-[320px] flex flex-col">
              {isGroupCentered ? (
                <div className="bg-slate-200/50 rounded-2xl border-2 border-dashed border-slate-300 p-6 flex flex-col items-center justify-center flex-1">
                  <Users size={32} className="text-slate-400 mb-2 opacity-50" />
                  <span className="text-slate-500 font-bold text-center text-sm">중앙 화면에서<br/>실행 중</span>
                </div>
              ) : renderGroupWidget(false)}
            </div>
          </div>

          {/* 중앙 집중형 (포커스 모달) */}
          {(isTimerCentered || isPickerCentered || isGroupCentered) && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm">
              {isTimerCentered && renderTimerWidget(true)}
              {isPickerCentered && renderPickerWidget(true)}
              {isGroupCentered && renderGroupWidget(true)}
            </div>
          )}
        </div>
      );
    }

    // 리액트 앱 렌더링
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
